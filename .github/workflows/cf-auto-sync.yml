name: Cloudflare IP Auto Scanner & Sync

on:
  schedule:
    # 每天北京时间早上 5:00 (UTC 时间 21:00) 自动运行，避开 GitHub 整点排队高峰期
    - cron: '00 21 * * *'
  # Allow manual trigger from the GitHub Actions tab
  workflow_dispatch:

jobs:
  scan-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run CF Scanner and Sync
        env: 
          # GitHub Secrets injected as environment variables
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_TARGET_DOMAIN: ${{ secrets.CF_TARGET_DOMAIN }}
          CF_EMAIL: ${{ secrets.CF_EMAIL }}
          CHECK_API_URL: ${{ secrets.CHECK_API_URL }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python scripts/cf_scanner_sync.py

      # 不管上面这步成功还是失败，这里都要执行——目的是保证这个仓库不会超过60天
      # 无提交、被GitHub自动暂停定时任务。心跳文件只在距上次心跳超过下面这个
      # 天数时才更新，避免每天都产生一条纯保活commit。
      - name: Commit and Push IP Log
        if: always()
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          # ↓↓↓ 想测试20天/45天，就是改这一行这个数字 ↓↓↓
          HEARTBEAT_INTERVAL_DAYS=30

          now_epoch=$(date -u +%s)
          if [ -f last_run.state ]; then
            last_epoch=$(date -u -d "$(cat last_run.state)" +%s 2>/dev/null || echo 0)
          else
            last_epoch=0
          fi
          diff_days=$(( (now_epoch - last_epoch) / 86400 ))
          echo "距上次心跳: ${diff_days} 天（阈值: ${HEARTBEAT_INTERVAL_DAYS} 天）"

          if [ "$diff_days" -ge "$HEARTBEAT_INTERVAL_DAYS" ]; then
            date -u +"%Y-%m-%dT%H:%M:%SZ" > last_run.state
            echo "心跳已更新: $(cat last_run.state)"
          fi

          for f in ips-v4.txt subdomain_prefix.state subnet_cursor.state known_subnets.state subnet_health.state region_miss_streak.state last_run.state; do
            [ -f "$f" ] && git add "$f"
          done
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: 自动更新最新优选 IP [skip ci]" && git push)
